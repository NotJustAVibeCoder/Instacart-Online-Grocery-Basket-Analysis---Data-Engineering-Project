version: 2

models:
  - name: stg_aisles
    description: Staging model for Instacart aisles.
    columns:
      - name: aisle_id
        tests:
          - not_null
          - unique
      - name: aisle
        tests:
          - not_null

  - name: stg_departments
    description: Staging model for Instacart departments.
    columns:
      - name: department_id
        tests:
          - not_null
          - unique
      - name: department
        tests:
          - not_null

  - name: stg_products
    description: Staging model for Instacart products.
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_name
        tests:
          - not_null
      - name: aisle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aisles')
                field: aisle_id
      - name: department_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id

  - name: stg_orders
    description: Staging model for Instacart orders.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
      - name: eval_set
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prior', 'train', 'test']
      - name: order_number
        tests:
          - not_null
      - name: order_dow
        tests:
          - not_null
      - name: order_hour_of_day
        tests:
          - not_null

  - name: stg_order_products_prior
    description: Staging model for prior order line items.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: add_to_cart_order
        tests:
          - not_null
      - name: reordered
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
